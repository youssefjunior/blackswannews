<script>

// CORREÇÃO PRINCIPAL: callAI usa proxy Anthropic sem API key
// ══════════════════════════════════════════════════════════
const newsCache = {};
let cat = 'Destaques';
let isLoading = false;

async function callAI(prompt, maxTokens = 900) {
  const res = await fetch('/api/v1/ai/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-3-5-sonnet',
      messages: [{ role: 'user', content: prompt }],
      max_tokens: maxTokens
    })
  });
  if(!res.ok) throw new Error('Falha HTTP: ' + res.status);
  const data = await res.json();
  return data.choices?.[0]?.message?.content || data.content?.[0]?.text || data.text || '';
}

const CAT_PROMPTS = {
  'Destaques': 'Busque as 7 notícias mais importantes e críticas dos mercados globais (Fed, inflação, guerras, movimentações abruptas de commodities). Retorne estritamente um array JSON válido sem marcações markdown: [{"title":"título claro","desc":"resumo condensado","source":"Reuters","url":"#","time":"5m atrás","tag":"MERCADO"}]',
  'Geopolítica': 'Busque 7 notícias geopolíticas de grande impacto global. Responda APENAS JSON.',
  'Bancos Centrais': 'Busque 7 notícias sobre Fed, BCE, Banco Central do Japão, juros e liquidez global. Responda APENAS JSON.'
};

function parseJSON(raw) {
  const match = raw.match(/\[[\s\S]*\]/);
  if (!match) throw new Error('JSON array não encontrado');
  return JSON.parse(match[0].replace(/[\u0000-\u001F\u007F-\u009F]/g, ' '));
}

async function loadNews(q) {
  if (q==='📈 Gráficos' || q==='🌾 Agronegócio' || q==='Análises SMC') return;
  if (newsCache[q]) { render(newsCache[q], q); return; }
  showSkeleton(q);
  try {
    const raw = await callAI(CAT_PROMPTS[q] || CAT_PROMPTS['Destaques']);
    const articles = parseJSON(raw);
    newsCache[q] = articles;
    if (cat === q) render(articles, q);
  } catch(e) {
    document.getElementById('feed').innerHTML = `<div class="err-box">⚠️ Erro: ${e.message}</div>`;
  }
}

function render(articles, title) {
  const feed = document.getElementById('feed');
  if(!feed) return;
  let html = `<div class="slabel">${title} · Inteligência Ativa</div>`;
  articles.forEach(a => {
    html += `<article class="mini" onclick="window.open('${a.url||'#'}','_blank')">
      <div>
        <span class="badge bc">${a.tag||'INFO'}</span>
        <h2>${a.title}</h2>
        <p>${a.desc}</p>
        <div class="meta"><span>${a.source||'Fonte'} · ${a.time||'agora'}</span></div>
      </div>
    </article>`;
  });
  feed.innerHTML = html;
}

function showSkeleton(label) {
  document.getElementById('feed').innerHTML = `<div class="slabel">Carregando · ${label}...</div>`;
}

function selectCat(c) {
  cat = c;
  document.querySelectorAll('.nvi').forEach(i => i.classList.remove('active'));
  const t = document.querySelector(`.nvi[data-cat="${c}"]`);
  if(t) t.classList.add('active');

  const layout = document.getElementById('main-layout');
  const chartsec = document.getElementById('chartsec');
  const agrosec = document.getElementById('agrosec');
  const asec = document.getElementById('asec');

  layout.style.display = 'none'; chartsec.style.display = 'none'; agrosec.style.display = 'none'; asec.style.display = 'none';

  if (c === '📈 Gráficos') { chartsec.style.display = 'block'; showCharts(null, 'indices'); }
  else if (c === '🌾 Agronegócio') { agrosec.style.display = 'block'; loadAgroNews(); }
  else if (c === 'Análises SMC') { asec.style.display = 'block'; }
  else { layout.style.display = ''; loadNews(c); }
}

async function loadAgroNews() {
  const grid = document.getElementById('agro-news-grid');
  try {
    const raw = await callAI('Busque as notícias mais recentes do Agronegócio. Retorne JSON.');
    const news = parseJSON(raw);
    grid.innerHTML = news.slice(0,3).map(n => `<div class="agro-news-card"><div class="agro-news-title">${n.title}</div><div class="agro-news-desc">${n.desc}</div></div>`).join('');
  } catch(e) { console.log(e); }
}

function showCharts(e, type) {
  const container = document.getElementById('chart-container');
  if(type==='indices') {
    container.innerHTML = `<div class="chart-grid"><div class="chart-frame"><iframe src="https://s.tradingview.com/widgetembed/?symbol=CME_MINI%3ANQ1!&theme=dark"></iframe></div></div>`;
  }
}

function showAgroCharts(e, type) {
  const container = document.getElementById('agro-chart-container');
  container.innerHTML = `<div class="agro-chart-frame"><iframe src="https://s.tradingview.com/widgetembed/?symbol=CBOT%3AZS1!&theme=dark"></iframe></div>`;
}

function mobNav(el, section) {
  document.querySelectorAll('.mob-bn-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  if (section === 'charts') selectCat('📈 Gráficos');
  else if (section === 'agro') selectCat('🌾 Agronegócio');
  else if (section === 'smc') selectCat('Análises SMC');
  else selectCat('Destaques');
}

function openVideo(id, title) {
  document.getElementById('vmodal-title').textContent = title;
  document.getElementById('vmodal-frame').src = 'https://www.youtube.com/embed/' + id + '?autoplay=1';
  document.getElementById('vmodal').classList.add('open');
}
function closeVideo() {
  document.getElementById('vmodal').classList.remove('open');
  document.getElementById('vmodal-frame').src = '';
}
function openAgroChart(symbol, label) {
  document.getElementById('agro-chart-modal-title').textContent = label;
  document.getElementById('agro-chart-modal-frame').src = 'https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(symbol)+'&theme=dark';
  document.getElementById('agro-chart-modal').classList.add('open');
}
function closeAgroChart() {
  document.getElementById('agro-chart-modal').classList.remove('open');
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nvi').forEach(i => i.addEventListener('click', e => selectCat(e.target.getAttribute('data-cat'))));
  selectCat('Destaques');
});
</script>
</body>
</html>
